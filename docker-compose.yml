services:
  web:
    build: .
    ports:
      - "3000:3000"
    # Runtime tokens from .env.local (not baked into the image):
    # BRAPI_TOKEN, BOLSAI_API_KEY, GEMINI_API_KEY.
    # Do not also list empty copies under `environment` — unset shell
    # vars would override and blank these.
    env_file:
      - path: .env.local
        required: false
